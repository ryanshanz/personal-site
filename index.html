<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Shanz</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Lucida Console;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 50px 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
      max-width: 500px;
      width: 100%;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    img{
        font-size: xx-small;
    }

    .footer {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">
        🚧
    <div>
    <h1>under construction</h1>
    <p>
      been a bit busy! 
    </p>
    <div class="gif">
        <img class="gif" src="raj.gif" alt="Dancing animation" width="90%" height="90%"/>
    </div>
    <div class="footer">
      © 2026 me
    </div>
  </div>
</body>
</html>
